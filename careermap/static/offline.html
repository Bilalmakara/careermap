<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CareerMap — Çevrimdışı</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    .icon {
      width: 72px;
      height: 72px;
      background: rgba(56, 189, 248, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 10px;
      color: #fff;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      max-width: 340px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      background: #0284c7;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>İnternet Bağlantısı Yok</h1>
  <p>CareerMap çevrimdışı modda. Önceden yüklenmiş sayfalarınıza dönebilir veya bağlantınız geldiğinde tekrar deneyebilirsiniz.</p>
  <button class="btn" onclick="window.location.reload()">Tekrar Dene</button>
</body>
</html>
