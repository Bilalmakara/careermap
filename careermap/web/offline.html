<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CareerMap — Çevrimdışı Mod</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    .icon {
      width: 76px;
      height: 76px;
      background: rgba(56, 189, 248, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 10px;
      color: #fff;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      max-width: 360px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .notice {
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(220, 38, 38, 0.3);
      color: #fca5a5;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      max-width: 360px;
      margin-bottom: 24px;
    }
    .btn {
      background: #0284c7;
      color: white;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>İnternet Bağlantısı Bekleniyor</h1>
  <p>CareerMap çevrimdışı modda. İnternet bağlantınız sağlandığında araştırma yapabilir ve başvurularınızı gönderebilirsiniz.</p>
  <div class="notice">
    🔒 Gizlilik Koruması: Aday CV'niz ve kurum iletişimleri güvenlik amacıyla telefon belleğinde çevrimdışı saklanmaz.
  </div>
  <button class="btn" onclick="window.location.reload()">Bağlantıyı Yenile</button>
</body>
</html>
